<div class="bootstrap-wrapper">
  <div class="container">
    <div class="row" >
      <div class="col-md-6 offset-md-3">
        <mat-card>
        <div class="container text-center">
          <img src="../../../assets/exam.jpg" alt="exam">
        </div>
        <h1 class="text-center">Register Here !!</h1>
        <!--{{user | json}}-->
        <form (ngSubmit)="formSubmit()">
          <!--user name field--> <!--fill-->
          <mat-form-field class="full-width" appearance="outline">
            <mat-label>Username</mat-label>
            <input required [(ngModel)]="user.username" name="username" matInput placeholder="Enter User Name">
            <mat-hint>User name must be unique !!</mat-hint>
          </mat-form-field>
          <!--user password field-->
          <mat-form-field class="full-width" appearance="outline">
            <mat-label>User Password</mat-label>
            <input required [(ngModel)]="user.password" name="password" type="password" matInput
              placeholder="Enter Password">
          </mat-form-field>
          <!--first name field-->
          <mat-form-field class="full-width" appearance="outline">
            <mat-label>First Name</mat-label>
            <input required [(ngModel)]="user.firstName" name="firstName" matInput placeholder="Enter First Name">
          </mat-form-field>
          <!--last name field-->
          <mat-form-field class="full-width" appearance="outline">
            <mat-label>Last Name</mat-label>
            <input required [(ngModel)]="user.lastName" name="lastName" matInput placeholder="Enter Last Name">
          </mat-form-field>
          <!--Email field-->
          <mat-form-field class="full-width" appearance="outline">
            <mat-label>Email Address</mat-label>
            <input required [(ngModel)]="user.email" name="email" type="email" matInput
              placeholder="Enter Email Address">
          </mat-form-field>
          <!--Phone Number field-->
          <mat-form-field class="full-width" appearance="outline">
            <mat-label>Phone Number</mat-label>
            <input required [(ngModel)]="user.phone" name="phone" type="number" matInput
              placeholder="Enter Phone Number">
          </mat-form-field>
          <!--Profile image field-->
          <mat-form-field class="full-width" appearance="outline">
            <mat-label>Profile</mat-label>
            <input [(ngModel)]="user.profile" name="photo" type="photo" matInput placeholder="Enter Photo Link">
          </mat-form-field>

          <div class="container text-center">
            <button type="submit" mat-raised-button color="primary">Register</button>
            <button style="margin-left: 20px;" mat-raised-button color="accent">Clear</button>
          </div>



        </form>
      </mat-card>
      </div>
    </div>
  </div>
</div>
