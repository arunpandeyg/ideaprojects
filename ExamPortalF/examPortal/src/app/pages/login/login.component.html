<div class="bootstrap-wrapper">
    <div class="container">
        <div class="row mt20" >
            <div class="col-md-6 offset-md-3">
                <mat-card>
                    <div class="container text-center">
                        <img src="../../../assets/log.jpg"  alt="exam">
                    </div>
                        <h1 class="text-center">Login Here !!</h1>
                    <!--username field-->
                    <form action="">
                        <mat-form-field class="full-width" appearance="outline">
                            <mat-label>Username</mat-label>
                            <input required  matInput placeholder="Enter User Name">
                            <mat-hint>Valid User Name !!</mat-hint>
                        </mat-form-field>
                        <!--password fiels-->
                        <mat-form-field class="full-width" appearance="outline">
                            <mat-label>Password</mat-label>
                            <input type="password" required matInput placeholder="Enter User Name">
                        </mat-form-field>
                        <div class="container text-center" >
                            <button mat-raised-button color="primary" type="submit">Login</button>
                            <button class="ml20" mat-raised-button color="accent" type="text">Reset</button>
                        </div>
                       
                    </form>
                </mat-card>
            </div>   
        </div>
    </div>
</div>
